version: '3.8'

services:
  redis-master:
    image: redis:7.2-alpine  # 使用輕量且安全的 Alpine 版本
    container_name: redis_master
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_master.conf:/usr/local/etc/redis/redis.conf:ro
      - ./users_master.acl:/etc/redis/users.acl:ro  # ACL 文件權限管控掛載
      - redis_data:/data
      
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    
    # --- 日誌處理：限制日誌檔案大小與數量 ---
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

    # --- 資源限制：OS 層級的保護 ---
    deploy:
      resources:
        limits:
          memory: 1.2G  # 略高於 redis.conf 的 maxmemory 以留緩衝
    networks:
      - shared_net
  redis-replica:
    image: redis:7.2-alpine
    container_name: redis_replica
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - ./redis_slave.conf:/usr/local/etc/redis/redis.conf:ro
      - ./users_replica.acl:/etc/redis/users.acl:ro  # ACL 文件權限管控掛載
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    deploy:
      resources:
        limits:
          memory: 1.2G
    networks:
      - shared_net

volumes:
  redis_data:

networks:
  shared_net:
    external: true
    name: shared_network