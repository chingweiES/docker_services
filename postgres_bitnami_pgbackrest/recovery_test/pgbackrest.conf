[global]
# 非同步推送 WAL
archive-async=y
# 不用特別設定
# archive-get-queue-max=128MiB
# default: y, 搭配 archive-timeout 設定，會retry直到超時。避免假警報，穩定性
# archive-missing-retry=y

# archive-push-queue-max=

# WAL 傳輸的超時時間
archive-timeout=300

# 使用使用者自訂的鍵值對備份進行註釋，在CLI執行比較方便
# --annotation

# default:y  在備份完成之前，請檢查 WAL 段是否已歸檔。
# archive-check=y


# default:n, 確認怎麼使用 複製歸檔選項 (--archive-copy)
# archive-copy

# default: y, y的話。禁止使用 PostgreSQL archive_mode=always (always意思是無論是否有備份正在進行，都會歸檔WAL)。這樣可以確保 pgBackRest 能夠正確地管理 WAL 檔案，避免因為 PostgreSQL 的 archive_mode 設定不當而導致備份失敗或資料不一致的問題。
#archive-mode-check


# default: n 是否從備用叢集進行備份。
# y - Standby is required for backup.
# y – 備份時需要處於待命狀態。
# prefer - Backup from standby if available otherwise backup from primary.
# 偏好設定：如有備用系統，則從備用系統備份；否則，從主系統備份。
# n - Backup from primary only.
# n – 僅從主機進行備份。
# backup-standby=

# Exclude paths/files from the backup.
# exclude=

# default: y 在成功備份後，自動執行 expire 命令。
# expire-auto

# default: 1GiB Manifest save threshold during backup. (Manifest save threshold during backup.)
# 定義了在備份過程中，目錄清單會被儲存的頻率。儲存目錄清單很重要，因為它保存了校驗和值，並有助於恢復功能的順利運作。實際使用的閾值為備份大小的 1%，或者目錄清單儲存閾值，以較大者為準。
# manifest-save-threshold


# *****default: y 決定是否啟用恢復功能。在之前同類型的備份失敗後，恢復功能可大幅縮短重新進行備份所需的時間。不過，該功能會增加系統的複雜性，因此在不需要此功能的環境中，最好將其關閉。
# 建議關閉
# resume=n

# default:n
# 強制執行檢查點操作（透過將 y 值傳遞給備份開始功能的 fast 參數），從而使備份立即開始。否則，備份將在下一個定期檢查點之後才開始。
# start-fast=y


## -------------General Options   一般選項------------------------------
# 4.1~4.4還沒有看

# 
# none - no compression
# 無 - 無壓縮
# bz2 - bzip2 compression format
# bz2 - bzip2 壓縮格式
# gz - gzip compression format
# gz - gzip 壓縮格式
# lz4 - lz4 compression format (not available on all platforms)
# lz4 - lz4 壓縮格式（並非所有平台都支持）
# zst - Zstandard compression format (not available on all platforms)
# zst - Zstandard 壓縮格式（並非所有平台都支持）
# compress-type

# 
# compress-level

# 
# compress-level-network

# 
# db-timeout


# default: n 重要!!!!!!!!!! 使用校驗和進行恢復或備份。
# 在恢復過程中，PostgreSQL 的數據和表空間目錄按預設應存在但為空。此選項會利用校驗和值來執行差異恢復。
# 在備份過程中，此選項會使用校驗和來判斷是否要複製檔案，而非時間戳。
# delta=y

# 用於連接及讀寫操作的超時時間，單位為秒。 整個讀/寫操作並不需要在該超時時間內完成，但必須要有進展，哪怕只讀寫一個字節而已
# io-timeout

# 儲存鎖定檔案(lock file)的路徑鎖定路徑是用於讓 pgBackRest 建立鎖定檔案的位置，藉此防止同時發生衝突的操作 
# lock-path

# 確認如何使用
# neutral-umask

# 設定程序優先權 確認如何使用
# priority

# 用於壓縮/傳輸的最大處理數量，不要將 process-max 設定得過高，以免影響資料庫的效能
# process-max

# 設定本地或遠端程序在協定層面上等待接收新消息的超時時間，可避免程序無限期地等待消息
# 值必須大於 db-timeout 
# protocol-timeout

# 保持連線功能已啟用，啟用套接字連線上的保持連線訊息功能 確認如何使用
# sck-keep-alive

# !!! 重要，暫存數據的儲存路徑。儲存異步的 archive-push 和 archive-get 指令
# spool-path

# 保持連線的空閒時間，在沒有網路活動的情況下，經過多長時間（以秒計）後，操作系統應該發送 TCP 保持連線訊息 確認如何使用
# tcp-keep-alive-count

# 保持連線間隔時間。指定在未收到確認回應後，應重新傳輸 TCP 保持連線訊息的時間長度（以秒為單位）。 確認如何使用
# tcp-keep-alive-interval

# !!! 重要，允許的 TLSv1.2 加密套件，用戶端與伺服器之間的所有 TLS 連線都經過加密。若未設定（即保持預設值），則會使用底層 OpenSSL 函式庫的預設值。
# tls-cipher-12

# !!! 重要，允許的 TLSv1.3 加密套件。
# tls-cipher-13


# ------------------------------------ 5. LOG -----------------------------------
# off - No logging at all (not recommended)
# error - Log only errors
# warn - Log warnings and errors
# info - Log info, warnings, and errors
# detail - Log detail, info, warnings, and errors
# debug - Log debug, detail, info, warnings, and errors
# trace - Log trace (very verbose debugging), debug, info, warnings, and errors

# default: warn，主機端記錄的等級
# log-level-console=warn

# default: warn，檔案記錄的等級。
# log-level-file

# default: off，標準錯誤記錄的等級
# log-level-stderr

# default: /var/log/pgbackrest，儲存日誌檔案的路徑，log-level-file=off，則不需要日誌路徑
# log-path


# --- 6. Maintainer Options------------------------------
# 不當使用這些選項可能導致意外行為或資料損壞。
# 先不做設定
# -------------------------------------------------------


# --- 7. Repository Options   儲存庫選項

# 7.1~7.6 跟Azure有關先不看


# default: n, 啟用區塊增量備份
# 檔案的區塊大小是根據檔案的大小和存儲時間來決定的。一般而言，存儲時間較長或大小較大的檔案，會被分配較大的區塊大小。如果某個檔案存儲時間過長，就不再使用區塊增量方式來進行備份。
# 若對所有備份類型（包括完整備份）都啟用區塊增量備份，其效率會最高。這雖會使完整備份的體積稍大一些，但後續的差異備份和增量備份可以利用完整備份所生成的區塊對應表來節省空間。
# repo1-block=y

# default: repo1-bundle=y 將檔案打包至儲存庫中。
# 將較小的檔案合併起來，以減少寫入儲存庫的檔案總數。撰寫的檔案越少，效率通常越高，尤其是在 S3 這類物件儲存服務上。此外，零長度的檔案不會被儲存（目錄檔除外），這有助節省時間和空間。
# repo1-bundle

# default: 2MiB 檔案包的數量限制。 確認如何使用
# 在恢復備份時，已打包的檔案無法再次使用。因此，此選項用於控制可恢復的檔案。數值越大，可恢復的檔案就越少。
# repo-bundle-limit

# default: 20MiB 檔案包的目標大小 定義了將被添加到單個包中的所有文件的總大小。大多數包的大小會小於此值，但也有可能有些包會稍大一些。因此，請不要將此選項設定為您的檔案系統所允許的最大值。
# 一般而言，將此選項設定得過高並非良策，因為重試時必須重新處理整個資料包
# repo1-bundle-size=10MiB


# 儲存庫加密密碼片語。用於加密/解密該儲存庫中檔案的密語。
# repo-cipher-pass
# repo1-cipher-pass=zWaf6XtpjIVZC5444yXB+cgFDFl7MxGlgkZSaoPvTGirhPygu4jOKOXf9LO4vjfO

# GCS 相關
# default: none (不加密), 用於加密該儲存庫的密碼 aes-256-cbc
# repo-cipher-type

# 用於儲存該儲存庫的 GCS 儲存桶。 確認如何使用
# repo1-gcs-bucket=/pg-backup

# default: storage.googleapis.com GCS 儲存庫端點 用於連接儲存服務的端點。可能會更新為使用本機的 GCS 伺服器或其他端點。 確認如何使用
# repo1-gcs-endpoint=localhost

# repo-gcs-key 根據 repo-gcs-key-type 選項的不同，可能是令牌或服務金鑰檔案 確認如何使用
# example: repo1-gcs-key=/etc/pgbackrest/gcs-key.json


# GCS 儲存庫金鑰類型(auto , survice, token) 確認如何使用
# repo1-gcs-key-type=auto


# 用於確定請求計費的 GCS 專案 ID。
# repo1-gcs-user-project=my-project


# 儲存庫中各個備份檔案之間的硬連結。 確認如何使用
# 允許在差異備份和增量備份中，將檔案以硬連結的方式與完整備份相連。這會讓人覺得，從檔案系統層面來看，每個備份都是完整備份。不過必須小心，因為修改被硬連結的檔案可能會影響該備份集中的所有備份。
# repo1-hardlink=y


# 遠端操作時的儲存庫主機，在將資料備份及歸檔到本機掛載的檔案系統時，不需要此設定。
# repo1-host=repo1.domain.com


# 儲存庫主機憑證授權單位檔案
# repo1-host-ca-file=/etc/pki/tls/certs/ca-bundle.crt


# 儲存庫主機憑證授權機構路徑。在連接到儲存庫主機時，請使用非系統預設的 CA 路徑。
# repo1-host-ca-path=/etc/pki/tls/certs


# 儲存庫主機憑證檔案。傳送至儲存庫主機以驗證用戶身分。
# repo1-host-cert-file=/path/to/client.crt


# Repository 主機的 pgBackRest 命令。
# 僅當本地主機與儲存庫主機上的 pgBackRest 命令路徑不同时才需要填寫。如果未定義，則儲存庫主機的命令將與本地命令相同。
# repo1-host-cmd=/usr/lib/backrest/bin/pgbackrest


# pgBackRest 儲存庫主機設定檔。
# repo1-host-config=/conf/pgbackrest/pgbackrest.conf


# pgBackRest 儲存庫主機配置包含路徑
# 設定儲存庫主機上配置包含路徑的位置。只有在儲存庫主機的配置包含路徑與本機的配置包含路徑不同時，才需要進行此設定。
# repo1-host-config-include-path=/conf/pgbackrest/conf.d

# pgBackRest 儲存庫主機配置路徑。
# repo1-host-config-path=/conf/pgbackrest


# 儲存庫主機金鑰檔案。
# repo1-host-key-file=/path/to/client.key


# 當設定了 repo-host 時，用於連接該主機的端點號。 確認如何使用
# 當 repo-host-type=ssh 時，repo-host-port 沒有預設值。此情況下，該端點號將取決於 cmd-ssh 指定的命令所配置的端點號。
# repo-host-port

# default: ssh 儲存庫主機協定類型。 (ssh or tls - pgBackRest 的 TLS 伺服器。)
# repo1-host-type=tls


# default: pgbackrest 當設定了 repo-host 時，用於該儲存庫的主機使用者。
# 定義了用於在儲存庫主機上進行操作的用戶。最好是不要使用 postgres 用戶，而應使用 pgbackrest 之類的其他用戶。如果 PostgreSQL 在儲存庫主機上運行，可以將 postgres 用戶加入 pgbackrest 群組，
# 這樣該用戶就能擁有對儲存庫的讀取權限，同時又不會意外損壞其中的內容。
# repo1-host-user=repo-user


# default: /var/lib/pgbackrest 儲存備份和歸檔檔案的路徑。
# 很難事先準確估算需要多大的空間。最好的做法是先進行一些備份，記錄不同類型備份的佔用空間大小（完整備份/增量備份/差異備份），並測量每天生成的 WAL 數量。這樣就能大致了解所需的空間大小。當然，隨著數據庫的發展，需求也有可能隨之改變。
# repo-path

# 
# 

# 
# 


# --- Stanza Options
# 
# 

# PostgreSQL 資料庫
# pg1-database

# 遠端操作的 PostgreSQL 主機。
# pg1-host

# PostgreSQL 主機憑證授權機構檔案。
# pg1-host-ca-file=/etc/pki/tls/certs/ca-bundle.crt

# PostgreSQL 主機憑證授權路徑。
# pg1-host-ca-path=/etc/pki/tls/certs

# PostgreSQL 主機憑證檔案。傳送至 PostgreSQL 主機以驗證用戶端的身分。
# pg1-host-cert-file

# PostgreSQL 主機的 pgBackRest 命令。
# 只有在本地主機和 PostgreSQL 主機上，pgBackRest 命令的路徑不同時才需要填寫此項。如果未定義，則 PostgreSQL 主機上的命令將與本地主機上的命令相同。
# pg1-host-cmd=/usr/lib/backrest/bin/pgbackrest

# default: CFGOPTDEF_CONFIG_PATH "/" PROJECT_CONFIG_FILE
# pgBackRest 資料庫主機設定檔。
# pg1-host-config

# pgBackRest 資料庫主機設定包含路徑。
# default: CFGOPTDEF_CONFIG_PATH "/" PROJECT_CONFIG_INCLUDE_PATH
# pg1-host-config-include-path=/conf/pgbackrest/conf.d

# default: CFGOPTDEF_CONFIG_PATH
# pgBackRest 資料庫主機設定路徑。
# pg1-host-config-path=/conf/pgbackrest

# PostgreSQL 主機金鑰檔案。
# 證明該客戶端憑證是由所有者所發送的。
# pg1-host-key-file=/path/to/client.key

# 確認如何使用
# 當設定了 pg-host 時，即為 PostgreSQL 主機的連接端口。使用此選項可為 PostgreSQL 主機協議指定非預設的端點號。
# 當 pg-host-type=ssh 時，pg-host-port 沒有預設值。此時，該端點號將取決於 cmd-ssh 所指定的命令所配置的端點號。
# default (depending on pg-host-type):
#    tls - 8432

# allowed: [0, 65535]
# example: pg1-host-port=25
# pg1-host-port

# PostgreSQL 主機協定類型 (ssh or tls - pgBackRest 的 TLS 伺服器)。
# pg1-host-type

# default: postgres 主機使用者。當設定了 pg-host 時，PostgreSQL 會使用該用戶進行主機登入。
# pg1-host-user

# PostgreSQL 資料目錄
# 這個值應該與 PostgreSQL 所報告的 data_directory 相同。雖然這個值可以從各個地方取得，但為了避免在還原或離線備份時無法取得相關資料，最好還是將其明確設定好。
# pg-path 這個選項會在每次線上備份時，與 PostgreSQL 所報告的數值進行比對，因此其值應該始終是最新的。
# pg1-path=/data/db

# default: 5432 PostgreSQL 所運行的端點號。通常不需要特別指定，因為大多數 PostgreSQL 集群都使用預設的端點號。
# pg1-port

# PostgreSQL Unix 套接字路徑。 確認如何使用
# 在啟動 PostgreSQL 時所指定的 Unix 套接字目錄。pgBackRest 會自動在操作系統的標準位置中尋找該目錄，因此通常不需要手動指定此設定，除非通過 postgresql.conf 中的 unix_socket_directories 設定明確修改了套接字目錄的位置。
# pg1-socket-path=/var/run/postgresql

# PostgreSQL 資料庫使用者。
# 在連接到 PostgreSQL 時所使用的資料庫使用者名稱。如果未指定，pgBackRest 將使用本機作業系統的使用者或 PGUSER 來進行連線。
# pg1-user

# 將多個小檔案（如 WAL）打包成大檔案再傳輸。
bundle=y


# ── Backup Repository ─────────────────────────────────────────────────────────
repo1-path=/var/lib/pgbackrest

# Encryption at rest (AES-256-CBC)
# The passphrase is NOT stored here — it is injected at runtime via the
# PGBACKREST_REPO1_CIPHER_PASS environment variable (set by docker-entrypoint-wrapper.sh
# from /run/secrets/pgbackrest_cipher).
repo1-cipher-type=aes-256-cbc

# ── Retention ─────────────────────────────────────────────────────────────────
# 這是 pgbackrest 的保留策略設定，用於定義備份的保留規則，以確保備份存儲不會無限制增長，同時保留足夠的備份以應對數據恢復需求。
# default:count, time 代表單位為天，count代表單位為個
repo1-retention-full-type=count
# repo1-retention-full=2 表示 pgbackrest 將保留最近的兩個(或兩天，看repo1-retention-full-type)完整備份。當新的完整備份創建時，pgbackrest 會自動刪除最舊的完整備份，以確保只保留兩個完整備份在存儲中。
repo1-retention-full=2
# keep last 2 full backups
# repo1-retention-diff=7 表示 pgbackrest 將保留最近的七個增量備份。增量備份是相對於最近的完整備份而言的，僅包含自上次完整備份以來發生變化的數據。當新的增量備份創建時，pgbackrest 會自動刪除最舊的增量備份，以確保只保留七個增量備份在存儲中。
repo1-retention-diff=7
# keep last 7 differential backups

# ── Performance ───────────────────────────────────────────────────────────────
# process-max: pgbackrest 在執行備份時，可以使用多個進程來提高性能。這參數指定 pgbackrest 可以使用的最大進程數。
process-max=4
# compress-type: pgbackrest 支持多種壓縮算法，如 lz4、zstd 和 gzip。
# lz4 提供快速的壓縮和解壓縮速度，但壓縮率較低
# zstd 提供更好的壓縮率，但可能會稍微慢一些。
compress-type=lz4
# fast compression; use zstd for better ratio

# ── Backup Options ────────────────────────────────────────────────────────────
# start-fast: 如果為y，pgbackrest 在執行備份時會嘗試快速啟動 PostgreSQL 服務，以減少備份開始的延遲。這對於需要頻繁備份的環境特別有用，可以提高備份效率。
start-fast=y
# delta: 如果為y，pgbackrest 會在備份過程中使用增量備份技術，只備份自上次完整備份以來發生變化的數據。這可以顯著減少備份所需的時間和存儲空間，特別是在數據變化不大的情況下。
delta=y

# ── Logging ───────────────────────────────────────────────────────────────────
log-level-console=info
log-level-file=detail
log-path=/var/lib/pgbackrest/log

# ── Stanza: main ─────────────────────────────────────────────────────────────
# Stanza name must match the --stanza argument used in archive_command and
# all pgbackrest CLI invocations.
[main]
pg1-path=/bitnami/postgresql/data
pg1-socket-path=/tmp
pg1-user=postgres
pg1-port=5432
