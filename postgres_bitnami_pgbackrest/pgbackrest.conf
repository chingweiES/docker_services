[global]
# ── Backup Repository ─────────────────────────────────────────────────────────
repo1-path=/var/lib/pgbackrest

# Encryption at rest (AES-256-CBC)
# The passphrase is NOT stored here — it is injected at runtime via the
# PGBACKREST_REPO1_CIPHER_PASS environment variable (set by docker-entrypoint-wrapper.sh
# from /run/secrets/pgbackrest_cipher).
repo1-cipher-type=aes-256-cbc

# ── Retention ─────────────────────────────────────────────────────────────────
# 這是 pgbackrest 的保留策略設定，用於定義備份的保留規則，以確保備份存儲不會無限制增長，同時保留足夠的備份以應對數據恢復需求。
# repo1-retention-full=2 表示 pgbackrest 將保留最近的兩個完整備份。當新的完整備份創建時，pgbackrest 會自動刪除最舊的完整備份，以確保只保留兩個完整備份在存儲中。
repo1-retention-full=2
# keep last 2 full backups
# repo1-retention-diff=7 表示 pgbackrest 將保留最近的七個增量備份。增量備份是相對於最近的完整備份而言的，僅包含自上次完整備份以來發生變化的數據。當新的增量備份創建時，pgbackrest 會自動刪除最舊的增量備份，以確保只保留七個增量備份在存儲中。
repo1-retention-diff=7
# keep last 7 differential backups

# ── Performance ───────────────────────────────────────────────────────────────
# process-max: pgbackrest 在執行備份時，可以使用多個進程來提高性能。這參數指定 pgbackrest 可以使用的最大進程數。
process-max=4
# compress-type: pgbackrest 支持多種壓縮算法，如 lz4、zstd 和 gzip。
# lz4 提供快速的壓縮和解壓縮速度，但壓縮率較低
# zstd 提供更好的壓縮率，但可能會稍微慢一些。
compress-type=lz4
# fast compression; use zstd for better ratio

# ── Backup Options ────────────────────────────────────────────────────────────
# start-fast: 如果為y，pgbackrest 在執行備份時會嘗試快速啟動 PostgreSQL 服務，以減少備份開始的延遲。這對於需要頻繁備份的環境特別有用，可以提高備份效率。
start-fast=y
# delta: 如果為y，pgbackrest 會在備份過程中使用增量備份技術，只備份自上次完整備份以來發生變化的數據。這可以顯著減少備份所需的時間和存儲空間，特別是在數據變化不大的情況下。
delta=y

# ── Logging ───────────────────────────────────────────────────────────────────
log-level-console=info
log-level-file=detail
log-path=/var/lib/pgbackrest/log

# ── Stanza: main ─────────────────────────────────────────────────────────────
# Stanza name must match the --stanza argument used in archive_command and
# all pgbackrest CLI invocations.
[main]
pg1-path=/bitnami/postgresql/data
pg1-socket-path=/tmp
pg1-user=postgres
pg1-port=5432
